{{- /*
Secret with a lookup guard: on `helm upgrade`, if the Secret already exists
(e.g. created by kubectl or a previous release), we do NOT recreate it, so
an upgrade can never blank out or regenerate existing secret values.
*/ -}}
{{- if .Values.secrets.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "intent-router-laya.fullname" .) }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intent-router-laya.fullname" . }}
  labels:
    {{- include "intent-router-laya.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Placeholder: no secrets required for self-hosted Laya.
{{- end }}
{{- end }}
